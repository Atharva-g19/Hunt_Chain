[project]
name = "hunt-chain-project4"
version = "0.1.0"
description = "Hunt_Chain Project 4 - Validation and Controlled Exploitation"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [
    ".",
    "Project 1/ScopeGuard/src",
    "Project 2/src",
    "Project_3_Vulnerability/src",
    "Project_4_Validation_Exploitation/src",
    "Project_5_Reporting/src",
]
testpaths = ["tests", "tests_hunt_chain"]
