name: Hunt_Chain Cross-Platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and Hunt_Chain packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-cov pyyaml rich requests pydantic urllib3 jsonschema
          pip install -e "Project 1/ScopeGuard"
          pip install -e "Project 2"
          pip install -e "Project_3_Vulnerability"
          pip install -e "Project_4_Validation_Exploitation"
          pip install -e "Project_5_Reporting"
          pip install -e .

      - name: ScopeGuard Tests (Project 1)
        working-directory: "Project 1/ScopeGuard"
        run: |
          python -m pytest tests -v

      - name: Reconnaissance Tests (Project 2)
        working-directory: "Project 2"
        run: |
          python -m pytest tests -v

      - name: Vulnerability Tester Suites (Project 3 - 22 Families)
        working-directory: "Project_3_Vulnerability"
        run: |
          python -m pytest tests -v

      - name: Validation Layer Tests (Project 4)
        working-directory: "Project_4_Validation_Exploitation"
        run: |
          python -m pytest tests -v

      - name: Findings & Reporting Tests (Project 5)
        working-directory: "Project_5_Reporting"
        run: |
          python -m pytest tests -v

      - name: Hunt_Chain Core Orchestrator Integration Tests
        run: |
          python -m pytest tests_hunt_chain -v

      - name: Full Framework Regression Tests
        run: |
          python -m pytest tests -v
