name: Hunt_Chain Cross-Platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml rich requests pydantic urllib3

      - name: Project 1 ScopeGuard Tests
        working-directory: "Project 1/ScopeGuard"
        run: |
          python -m pytest tests -v

      - name: Project 2 Reconnaissance Tests
        working-directory: "Project 2"
        run: |
          python -m pytest tests -v

      - name: Project 3 Vulnerability Tester Suites
        working-directory: "Project_3_Vulnerability"
        run: |
          python -m pytest tests -v

      - name: Project 4 Validation Layer Tests
        working-directory: "Project_4_Validation_Exploitation"
        run: |
          python -m pytest tests -v

      - name: Project 5 Findings & Reporting Tests
        working-directory: "Project_5_Reporting"
        run: |
          python -m pytest tests -v

      - name: Hunt_Chain Core Orchestrator Integration Tests
        run: |
          python -m pytest tests_hunt_chain -v
