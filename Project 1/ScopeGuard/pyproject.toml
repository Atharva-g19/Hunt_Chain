[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scopeguard"
version = "0.1.0"
description = "Deterministic target authorization engine for security testing"
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
scopeguard = "scopeguard.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]