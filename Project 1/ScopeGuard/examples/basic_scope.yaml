program:
  name: "Example Authorized Security Program"

scope:
  rules:

    - id: "S001"
      effect: "include"
      asset:
        type: "hostname"
        value: "example.com"
        category: "web"
      description: "Authorized primary hostname"

    - id: "S002"
      effect: "include"
      asset:
        type: "host_wildcard"
        value: "*.api.example.com"
        category: "api"
      description: "Authorized API subdomains"

    - id: "S003"
      effect: "exclude"
      asset:
        type: "hostname"
        value: "admin.example.com"
        category: "web"
      description: "Explicitly excluded administrative hostname"

    - id: "S004"
      effect: "include"
      asset:
        type: "ipv4_cidr"
        value: "192.0.2.0/24"
        category: "network"
      description: "Documentation-only example IPv4 network"

    - id: "S005"
      effect: "include"
      asset:
        type: "ipv6_cidr"
        value: "2001:db8::/32"
        category: "network"
      description: "Documentation-only example IPv6 network"