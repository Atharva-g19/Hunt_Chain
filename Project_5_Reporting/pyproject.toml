[project]
name = "hunt-chain-reporting"
version = "0.1.0"
description = "Hunt_Chain Project 5 - Findings & Reporting Manager"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [
    "src",
    "../Project_3_Vulnerability/src",
    "../Project_4_Validation_Exploitation/src"
]
testpaths = ["tests"]
