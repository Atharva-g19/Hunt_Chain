# Hunt_Chain Project 2
# Local laboratory configuration.
#
# This configuration is intended for testing Project 2 against
# a locally controlled target only.
#
# IMPORTANT:
# The ScopeGuard reference below is intentionally a laboratory
# reference. The normal CLI ScopeGuard adapter remains fail-closed,
# so this configuration is primarily for configuration/pipeline
# testing with an explicitly authorized test harness.

target:
  value: "127.0.0.1"
  type: "IP_ADDRESS"

authorization:
  provider: "scopeguard"
  reference: "LOCAL_LAB_AUTHORIZED"
  scope_file: "config/lab_scope.yaml"

execution:
  mode: "active"

discovery:
  enabled: false
  providers:
    certificate_transparency:
      enabled: false

dns:
  enabled: true
  record_types:
    - A
    - AAAA
    - CNAME
  timeout_seconds: 5

  wildcard_detection:
    enabled: true

  dangling_cname_detection:
    enabled: true

politeness:
  concurrency: 2
  requests_per_second: 1
  timeout_seconds: 5

http:
  enabled: true
  schemes:
    - http
    - https
  ports:
    - 8000
  timeout_seconds: 5
  follow_redirects: true
  max_redirects: 3
  verify_tls: true
  response:
    collect_headers: true
    collect_body_hash: true

fingerprinting:
  enabled: true

  response_hash:
    enabled: true
    algorithm: "sha256"

technology:
  enabled: true

infrastructure:
  enabled: true
  shared_ip_detection: true

  provider_identification:
    enabled: true

output:
  directory: "./output/lab"

  formats:
    json: true
    report: true

  json:
    schema_version: "v1"

logging:
  level: "INFO"
  file: "./logs/lab-recon.log"